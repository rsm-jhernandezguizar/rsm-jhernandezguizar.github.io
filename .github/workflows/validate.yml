name: Validate portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.6.43'
      - run: |
          python3 scripts/render_profile.py
          git diff --exit-code -- _generated/
          quarto render index.qmd --no-execute
          quarto render Resume.qmd --no-execute
          quarto render portfolio/crea-circuitos-youtube/index.qmd --no-execute
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          path: docs/
          retention-days: 7
